services:
  api:
    build: .
    ports:
      - "5000:8080"
    environment:
      ConnectionStrings__Default: "Server=db,1433;Database=RealtimeNotifications;User Id=sa;Password=${SA_PASSWORD:-Your_strong_password123};TrustServerCertificate=True"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:-dev-only-signing-key-change-me-0123456789abcdef}"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "${SA_PASSWORD:-Your_strong_password123}"
    ports:
      - "1433:1433"
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${SA_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      retries: 10
      start_period: 30s
    volumes:
      - sqldata:/var/opt/mssql

volumes:
  sqldata:
